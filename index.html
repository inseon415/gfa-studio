<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>바이랩 GFA 광고 스튜디오</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e4e7ec;--ink:#111827;--sub:#6b7280;--mute:#9ca3af;--acc:#16a34a;--acc2:#dcfce7;--warn:#b45309;--warnbg:#fffbeb;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:14px;line-height:1.5}
a{color:inherit}
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.topin{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;white-space:nowrap}
.brand small{font-weight:500;color:var(--sub);margin-left:6px;font-size:12px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav.tabs a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--sub);font-weight:500}
nav.tabs a.on{background:var(--ink);color:#fff}
nav.tabs a:hover:not(.on){background:#f1f2f4}
.keybadge{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:#fff}
.keybadge.ok{border-color:#86efac;background:var(--acc2);color:#166534}
main{max-width:1200px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:18px;margin:0 0 12px}
.sub{color:var(--sub)}
.muted{color:var(--mute);font-size:12px}
section{margin-bottom:32px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat dt{color:var(--sub);font-size:12px}.stat dd{margin:4px 0 0;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#eee;display:block}
.cb{padding:12px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:#f1f2f4;color:#374151;white-space:nowrap}
.tag.p{background:var(--acc2);color:#166534;font-weight:600}
.tag.off{background:#fee2e2;color:#991b1b}.tag.on{background:#dbeafe;color:#1e40af}
.nm{font-weight:600;font-size:13px;word-break:break-all}
.kv{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-size:13px}
.kv b{font-size:15px}
.copy{font-size:13px;border-top:1px dashed var(--line);padding-top:6px}
.copy span{color:var(--sub);font-size:12px;display:block}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
select,input[type=text],input[type=password],textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{width:100%;resize:vertical}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:7px 14px}
button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
button.pri:disabled{opacity:.5;cursor:not-allowed}
button.lnk{border:none;background:none;padding:0;color:var(--blue);text-decoration:underline}
table{width:100%;border-collapse:collapse;background:#fff;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
th{background:#f9fafb;color:var(--sub);font-weight:600;font-size:12px;white-space:nowrap}
td.n,th.n{text-align:right}
.tbl{border:1px solid var(--line);border-radius:12px;overflow:auto}
.bars{display:flex;align-items:flex-end;gap:3px;height:170px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 12px 0;overflow-x:auto}
.bar{flex:1;min-width:22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;text-decoration:none}
.bar i{display:block;width:100%;background:var(--ink);border-radius:4px 4px 0 0}
.bar:hover i{background:var(--acc)}
.bar s{text-decoration:none;font-size:10px;color:var(--sub)}
.bar u{text-decoration:none;font-size:9px;color:var(--mute);padding:4px 0;white-space:nowrap}
.heat td.h{text-align:center;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);cursor:pointer;font-size:12px}
.chip:hover{border-color:var(--ink)}
.chip b{color:var(--acc);margin-left:4px}
.notice{background:var(--warnbg);border:1px solid #fde68a;color:var(--warn);border-radius:12px;padding:12px 14px;font-size:13px}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.qa{border-bottom:1px solid var(--line);padding:12px 0}
.qa .q{font-weight:600}
.qa .a{white-space:pre-wrap;margin-top:6px;color:#1f2937}
.parsed{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ref{border:2px solid transparent;border-radius:10px;overflow:hidden;background:#fff;cursor:pointer;position:relative}
.ref.sel{border-color:var(--acc)}
.ref img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.ref div{font-size:11px;padding:4px 6px;line-height:1.35}
.ref .ck{position:absolute;top:6px;right:6px;background:var(--acc);color:#fff;border-radius:999px;width:20px;height:20px;display:none;align-items:center;justify-content:center;font-size:12px}
.ref.sel .ck{display:flex}
.gen img{width:100%;display:block;background:#eee}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal.show{display:flex}
.mbox{background:#fff;border-radius:14px;max-width:960px;width:100%;padding:20px;position:relative}
.mclose{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;line-height:1}
.mgrid{display:grid;grid-template-columns:380px 1fr;gap:20px}
@media(max-width:760px){.mgrid{grid-template-columns:1fr}}
.mgrid img{width:100%;border-radius:10px;background:#eee}
tr.win td{background:#f0fdf4}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.pbox{background:#fff;height:240px;display:flex;align-items:center;justify-content:center;padding:18px;border-bottom:1px solid var(--line);box-sizing:border-box}
.card .pbox img,.pbox img{width:auto;height:auto;max-width:100%;max-height:204px;aspect-ratio:auto;object-fit:contain;background:none}
.pmini{display:flex;gap:12px;align-items:center;background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.pmini img{width:72px;height:72px;object-fit:contain;background:#fff;border-radius:8px}
pre.prompt{white-space:pre-wrap;background:#f9fafb;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;max-height:260px;overflow:auto}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style id="studio-theme">
/* ===== 바이랩 GFA 광고 스튜디오 · 브랜드 테마 (BY LAB 블루 #318CDD) ===== */
:root{
  --bg:#f4f5f7; --card:#fff; --line:#e3e6eb; --ink:#0f172a; --sub:#526072; --mute:#8a96a8;
  --navy:#1e6fc0; --navy2:#185fa6; --acc:#318cdd; --acc-d:#1e6fc0; --acc2:#e6f1fc; --brand:#318cdd; --deep:#123a66;
  --pos:#1e6fc0; --pos2:#e6f1fc; --neg:#b4232f; --neg2:#fde8ea; --blue:#2c5fd6; --warn:#8a5a00; --warnbg:#fff7e6;
}
body{background:var(--bg);font-family:Pretendard,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Pretendard,sans-serif;letter-spacing:-.02em}
h1{font-size:26px;font-weight:800}h2{font-size:18px;font-weight:700}
a{color:var(--blue)}
/* 헤더 */
header.top{background:var(--brand);border-bottom:none;box-shadow:0 2px 10px rgba(18,58,102,.18)}
.topin{padding:10px 20px;gap:18px;flex-wrap:nowrap}
.brand{color:#fff;font-size:16px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand small{display:none}
.brand .brandlogo{height:22px;width:auto;display:block}
.brand .brandname{padding-left:12px;border-left:1px solid rgba(255,255,255,.45);font-size:15px;font-weight:700;color:#fff}
nav.tabs{flex-wrap:nowrap;gap:2px}
nav.tabs a{color:rgba(255,255,255,.82);font-weight:600;font-size:14px;padding:8px 12px;border-radius:6px;white-space:nowrap}
nav.tabs a:hover:not(.on){background:rgba(255,255,255,.14);color:#fff}
nav.tabs a.on{background:#fff;color:var(--deep);box-shadow:none}
.keybadge{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:6px}
.keybadge.ok{background:#fff;color:var(--deep);border-color:#fff}
header.top .userbox,header.top .userbox span{color:rgba(255,255,255,.9) !important}
header.top .userbox button{color:#fff !important;background:transparent !important;border:1px solid rgba(255,255,255,.5) !important;border-radius:6px !important}
@media(max-width:1360px){.topin{flex-wrap:wrap;row-gap:6px}nav.tabs{order:3;flex-basis:100%}}
main{padding-top:28px}
/* 홈 배너 */
.studio-hero{position:relative;border-radius:14px;padding:28px 30px;margin-bottom:22px;background:linear-gradient(120deg,var(--deep) 0%,#1e6fc0 55%,#318cdd 100%);color:#fff;border:none;overflow:hidden}
.studio-hero:after{content:"+";position:absolute;right:34px;top:-18px;font-size:170px;font-weight:900;line-height:1;color:rgba(255,255,255,.10)}
.studio-hero .eyebrow{display:inline-block;color:#bfe0ff;font-size:12px;font-weight:700;letter-spacing:.06em;margin-bottom:8px;background:none;padding:0}
.studio-hero h1{font-size:28px;color:#fff;margin:0 0 6px;position:relative;z-index:1}
.studio-hero .sub{color:#d6e8fa;position:relative;z-index:1}
.filmstrip{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap;align-items:center;position:relative;z-index:1}
.filmstrip span{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#e6ebf2;border-radius:6px;padding:4px 10px;font-size:12px}
.filmstrip span:first-child{background:#fff;border-color:#fff;color:var(--deep);font-weight:700}
.fs-link{color:#fff;text-decoration:underline;font-size:12px;margin-left:6px}
.bulb{display:none}
/* KPI */
.stats{gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;border-top:3px solid var(--brand)}
.stat:nth-child(2){border-top-color:#7ab6ec}.stat:nth-child(3){border-top-color:var(--deep)}.stat:nth-child(4){border-top-color:#a9cdf2}
.stat dt{color:var(--sub);font-size:12px;font-weight:600}
.stat dd{font-size:20px;font-weight:800;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
/* 카드 */
.grid{gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:box-shadow .15s,transform .15s;transform:none;padding:0}
.card:hover{box-shadow:0 8px 24px rgba(15,23,42,.10);transform:translateY(-2px)}
.card:before{display:none}
.card>img{border-radius:0;background:#eef0f3}
.card .cb{padding:12px 14px 14px}
.card .nm{font-family:Pretendard,sans-serif;font-size:13px;font-weight:600;color:#334155;line-height:1.35}
.kv b{font-weight:800;color:var(--pos)}
.copy{border-top:1px solid #eef0f3}
.copy span{color:var(--mute);font-weight:600;font-size:11px;letter-spacing:.02em}
.tag{background:#f1f3f6;color:#475569;border-radius:5px;font-weight:600}
.tag.p{background:var(--acc2);color:var(--acc-d)}
.tag.on{background:var(--pos2);color:var(--pos)}.tag.off{background:#f1f3f6;color:#8a96a8}
/* 박스·필터·표 */
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:none}
.filters{background:var(--card);border:1px solid var(--line);border-radius:12px}
select,input[type=text],input[type=password],input[type=email],input[type=number],textarea{border:1px solid #d7dce3;border-radius:8px;background:#fff;font:inherit;padding:7px 10px}
select:focus,input:focus,textarea:focus{outline:2px solid rgba(44,95,214,.2);border-color:var(--blue)}
button{border-radius:8px;border:1px solid #d7dce3;background:#fff;color:var(--ink);font-weight:600}
button:hover{border-color:#b8c0cc}
button.pri{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:none}
button.pri:hover{background:var(--navy2)}
button.lnk{color:var(--blue);font-weight:500}
.tbl{border:1px solid var(--line);border-radius:12px}
table{background:#fff} th{background:#f7f8fa;color:var(--sub);font-weight:700;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid #eef0f3}
tr.win td{background:#f2faf6}
.bars{background:#fff;border:1px solid var(--line);border-radius:12px}
.bar i{background:#c3cad6;border-radius:3px 3px 0 0}.bar:hover i{background:var(--acc)}
.chip{background:#fff;border:1px solid #d7dce3;border-radius:6px;font-weight:600}.chip b{color:var(--acc-d)}
.notice{background:var(--warnbg);border:1px solid #f1dcaa;color:var(--warn);border-radius:10px}
.ref{border-radius:8px;border:2px solid transparent;box-shadow:0 1px 3px rgba(15,23,42,.08)}.ref.sel{border-color:var(--acc)}.ref .ck{background:var(--acc)}
.pmini{background:#f7f8fa;border:1px solid var(--line)}
.mbox{background:#fff;border-radius:14px}
.card .pbox{background:linear-gradient(180deg,#fafbfc 0%,#eff1f4 100%);border-bottom:1px solid var(--line);border-radius:0}
.galtabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.galtab{padding:6px 12px;border-radius:6px;border:1px solid #d7dce3;background:#fff;color:#475569;font-weight:600;font-size:13px}
.galtab b{color:var(--acc-d);margin-left:2px}
.galtab.on{background:var(--navy);border-color:var(--navy);color:#fff}.galtab.on b{color:#bfe0ff}
/* 섹션 제목 */
section>h2,.row>h2{display:flex;align-items:center;gap:8px}
section>h2:before,.row>h2:before{content:"";width:4px;height:16px;border-radius:2px;background:var(--acc);display:inline-block}
.studio-hero h1:before{display:none}
/* 위너 기준 상자 */
.rulebox{margin-bottom:24px;border-left:4px solid var(--acc)}
.rulebox .rec{background:#f7f8fa;border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:260px}
.rule-edit label{font-size:12px;color:var(--sub);font-weight:600;display:flex;align-items:center;gap:6px}
.kv .sales{font-weight:700;color:var(--deep)}
.kv b{color:var(--brand)}
tr.win td{background:#eef6fe}
.bar i{background:#b9d6f3}
button.pri{background:var(--brand);border-color:var(--brand)}button.pri:hover{background:var(--navy2)}
@media(max-width:1360px){.brand .brandname{font-size:14px}}
</style>

</head>

<script type="text/plain" id="appsrc">
"use strict";
const D = window.__GFA_DATA__;
const C = new Map(D.creatives.map(c => [c.n, c]));
const STATS = D.stats.map(([month, n, cost, proas, psales, pc, imp, click, roas]) => ({ month, n, cost, proas, psales, pc, imp, click, roas }));
const RULE = D.rule;
const isWin = s => s.cost >= RULE.minCost && s.proas >= RULE.minPurchaseRoas && s.pc >= (RULE.minPurchases || 0);
const ruleText = (r = RULE) => `한 달 총 비용 ${Math.round(r.minCost).toLocaleString('ko-KR')}원 이상 · 구매완료 광고수익률 ${r.minPurchaseRoas}% 이상${r.minPurchases ? ` · 구매완료 수 ${r.minPurchases}건 이상` : ''}`;
const SEASONS = ['봄', '여름', '가을', '겨울'];
const seasonOf = m => { const k = +m.slice(5, 7); return k >= 3 && k <= 5 ? '봄' : k >= 6 && k <= 8 ? '여름' : k >= 9 && k <= 11 ? '가을' : '겨울'; };
const W = STATS.filter(isWin).map(s => {
  const c = C.get(s.n); const t = D.imgText[s.n] || {};
  return { ...c, ...s, season: seasonOf(s.month), year: +s.month.slice(0, 4), it: t.imageText || '', vis: t.visual || '' };
}).sort((a, b) => b.month.localeCompare(a.month) || b.proas - a.proas);
// 같은 소재 = 같은 소재 번호, 또는 이미지 속 문구·광고 문구가 같은 재업로드
W.forEach(w => { w.g = w.it ? 'c:' + w.it + '|' + w.m : 'n:' + w.n; });
function groupWinners(list) {
  const m = new Map();
  for (const w of list) {
    let g = m.get(w.g);
    if (!g) { g = { ...w, rows: [], nosSet: new Set(), costSum: 0, salesSum: 0, best: 0, latest: '', anyOn: false }; m.set(w.g, g); }
    g.rows.push(w); g.nosSet.add(w.n); g.costSum += w.cost; g.salesSum += w.psales; g.anyOn = g.anyOn || w.on;
    if (w.proas > g.best) g.best = w.proas;
    if (w.month > g.latest) { g.latest = w.month; Object.assign(g, { n: w.n, nm: w.nm, a: w.a, img: w.img, cp: w.cp, as: w.as }); }
  }
  return [...m.values()].map(g => ({ ...g, on: g.anyOn, months: [...new Set(g.rows.map(r => r.month))].sort(), nos: [...g.nosSet], proasSum: g.costSum ? g.salesSum / g.costSum * 100 : 0 }));
}
const MONTHS = D.months;
const LATEST = MONTHS[MONTHS.length - 1];
const PRODUCT_LIST = D.products || [];
const REG_ORDER = PRODUCT_LIST.map(p => p.name);
const ordP = arr => [...arr].sort((a, b) => ((REG_ORDER.indexOf(a) + 1) || 999) - ((REG_ORDER.indexOf(b) + 1) || 999) || a.localeCompare(b));
const PRODUCTS = ordP(new Set(W.map(w => w.p))).filter(p => p !== '[확인필요]');
const productInfo = name => PRODUCT_LIST.find(p => p.name === name);
const GFA_SIZE = 1200;
const ALL_PRODUCTS = [...new Set(D.creatives.map(c => c.p))].sort();
const THUMB = n => D.thumbs[n] || '';
const won = x => Math.round(x).toLocaleString('ko-KR') + '원';
const man = x => (x >= 1e8 ? (x / 1e8).toFixed(1) + '억' : Math.round(x / 1e4).toLocaleString('ko-KR') + '만') + '원';
const pct = x => (Math.round(x * 10) / 10).toLocaleString('ko-KR') + '%';
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const $ = s => document.querySelector(s);
const app = $('#app');

// ---------- settings (AI key, stored only in this browser) ----------
const LS = { key: 'gfa-or-key', tm: 'gfa-text-model-v2', im: 'gfa-image-model-v2', qa: 'gfa-qa' };
const DEFAULT_TEXT_MODEL = 'anthropic/claude-sonnet-5.5';
const DEFAULT_IMAGE_MODEL = 'openai/gpt-5.4-image-2';
const getKey = () => localStorage.getItem(LS.key) || '';
const TEXT_MODEL = () => localStorage.getItem(LS.tm) || DEFAULT_TEXT_MODEL;
const IMAGE_MODEL = () => localStorage.getItem(LS.im) || DEFAULT_IMAGE_MODEL;
const modelName = id => ({ 'anthropic/claude-sonnet-5.5': 'Claude Sonnet 5.5', 'anthropic/claude-opus-5.5': 'Claude Opus 5.5', 'openai/gpt-5.4-image-2': 'GPT-5.4 Image 2', 'openai/gpt-5-image': 'GPT-5 Image', 'openai/gpt-5-image-mini': 'GPT-5 Image Mini' }[id] || id);
function refreshKeyBadge() { const b = $('#keybadge'); const ok = !!getKey(); b.textContent = 'AI 모델'; b.title = ok ? 'AI 모델 연결됨 (Claude + GPT)' : 'AI 모델 설정 (아직 연결 안 됨)'; b.classList.toggle('ok', ok); }
$('#keybadge').onclick = () => openSettings();
function openSettings() {
  openModal(`<h2>AI 모델 (OpenRouter)</h2>
  <p class="sub">질문하기의 AI 해설, 소재 만들기의 문구·이미지 생성에 씁니다. 키는 <b>이 브라우저에만</b> 저장되고, 요청은 이 PC에서 OpenRouter로 바로 갑니다.</p>
  <div class="box" style="margin:10px 0;padding:10px 14px"><b>글·분석</b>: Claude (Anthropic) · <b>이미지 생성</b>: GPT (OpenAI) · 둘 다 OpenRouter 키 하나로 씁니다.</div>
  <div class="notice" style="margin:10px 0">광고 이미지와 성과 숫자가 외부 AI(OpenRouter → Anthropic, OpenAI)로 전송됩니다. 회사 규정을 먼저 확인해 주세요. 키를 만들 때 사용 한도(예: 월 10달러)를 걸어 두는 걸 권합니다.</div>
  <p><label>OpenRouter API 키<br><input type="password" id="k1" style="width:100%" placeholder="sk-or-..." value="${esc(getKey())}"></label></p>
  <p><label>글·분석 모델 (Claude)<br><select id="k2" style="width:100%">${['anthropic/claude-sonnet-5.5', 'anthropic/claude-opus-5.5'].map(m => `<option value="${m}" ${m === TEXT_MODEL() ? 'selected' : ''}>${modelName(m)}${m === DEFAULT_TEXT_MODEL ? ' (기본, 추천)' : ' (더 정밀, 약 2배 비용)'}</option>`).join('')}</select></label></p>
  <p><label>이미지 생성 모델 (GPT)<br><select id="k3" style="width:100%">${['openai/gpt-5.4-image-2', 'openai/gpt-5-image', 'openai/gpt-5-image-mini'].map(m => `<option value="${m}" ${m === IMAGE_MODEL() ? 'selected' : ''}>${modelName(m)}${m === DEFAULT_IMAGE_MODEL ? ' (기본, 최신)' : m.endsWith('mini') ? ' (저렴한 시험용)' : ''}</option>`).join('')}</select></label></p>
  <div class="row"><button class="pri" id="ksave">저장</button><button id="kdel">키 지우기</button></div>`);
  $('#ksave').onclick = () => { localStorage.setItem(LS.key, $('#k1').value.trim()); localStorage.setItem(LS.tm, $('#k2').value); localStorage.setItem(LS.im, $('#k3').value); refreshKeyBadge(); closeModal(); route(); };
  $('#kdel').onclick = () => { localStorage.removeItem(LS.key); refreshKeyBadge(); closeModal(); route(); };
}
async function orChat(body) {
  const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST', headers: { 'Authorization': 'Bearer ' + getKey(), 'Content-Type': 'application/json', 'X-Title': 'GFA Ad Studio' }, body: JSON.stringify(body)
  });

// ---------- ANALYSIS ----------
const STOP = new Set(['이제', '진짜', '그냥', '너무', '우리', '이거', '이건', '정말', '하나', '바로', '보러가기', '강아지', '바이랩', '있는', '하는', '사용', '사용 전', '사용 후', '없음']);
function tokens(s) { return (s.match(/[가-힣A-Za-z0-9]+/g) || []).filter(t => t.length >= 2 && !STOP.has(t) && !/^\d+$/.test(t)); }
// ---------- 위너 기준 상자 ----------
const FULL_MONTHS = STATS.filter(s => s.month < LATEST);
const ACC_ROAS = (() => { const c = FULL_MONTHS.reduce((a, s) => a + s.cost, 0), p = FULL_MONTHS.reduce((a, s) => a + s.psales, 0); return c ? p / c * 100 : 0; })();
const RECOMMENDED = { minCost: 30000, minPurchaseRoas: 150, minPurchases: 3 };
function countFor(r) { const w = STATS.filter(s => s.cost >= r.minCost && s.proas >= r.minPurchaseRoas && s.pc >= (r.minPurchases || 0)); return { rows: w.length, cre: new Set(w.map(s => s.n)).size }; }
function ruleBox() {

      <label>구매 ROAS(%) <input type="number" id="rc2" step="5" min="0" value="${RULE.minPurchaseRoas}" style="width:80px"></label>

  </section>`;
}
function bindRuleBox() {
  const c1 = document.getElementById('rc1'); if (!c1) return;
  const val = () => ({ minCost: +c1.value || 0, minPurchaseRoas: +document.getElementById('rc2').value || 0, minPurchases: +document.getElementById('rc3').value || 0 });
  const prev = () => { const c = countFor(val()); document.getElementById('rcprev').textContent = `→ 위너 ${c.rows}건(소재 ${c.cre}개)`; };
  ['rc1', 'rc2', 'rc3'].forEach(id => document.getElementById(id).oninput = prev); prev();
  document.getElementById('rcrec').onclick = () => { c1.value = RECOMMENDED.minCost; document.getElementById('rc2').value = RECOMMENDED.minPurchaseRoas; document.getElementById('rc3').value = RECOMMENDED.minPurchases; prev(); };
  document.getElementById('rcsave').onclick = async () => {
    if (!window.sbClient) return alert('여기서는 저장할 수 없습니다.');
    const r = val(); if (!confirm(`위너 기준을 바꿀까요?\n${ruleText(r)}\n팀원 모두의 화면에 적용됩니다.`)) return;
    const { error } = await window.sbClient.from('app_data').upsert({ key: 'rule', payload: r, updated_at: new Date().toISOString() });
    if (error) return alert('저장 실패: ' + error.message);
    location.hash = '#analysis'; location.reload();
  };
}
function analysis() {
  const byP = {};
  const active = STATS.filter(s => s.cost >= RULE.minCost);
  for (const s of active) { const p = C.get(s.n).p; (byP[p] ||= { p, act: 0, win: 0, cost: 0, sales: 0, cre: new Set(), seasons: { 봄: 0, 여름: 0, 가을: 0, 겨울: 0 } }).act++; }
  for (const w of W) { const r = byP[w.p]; r.win++; r.cost += w.cost; r.sales += w.psales; r.cre.add(w.n); r.seasons[w.season]++; }
  const rows = Object.values(byP).filter(r => r.win).sort((a, b) => b.win - a.win);
  const byMonth = MONTHS.map(m => ({ m, n: W.filter(w => w.month === m).length, a: active.filter(s => s.month === m).length }));
  const maxN = Math.max(1, ...byMonth.map(x => x.n));
  const heatMax = Math.max(1, ...rows.flatMap(r => SEASONS.map(s => r.seasons[s])));
  // keyword frequency across distinct winner creatives
  const seen = new Map();
  for (const w of W) if (!seen.has(w.g)) seen.set(w.g, w);
  const freq = {};

      const rec = { product: p, direction: dir, refs: refs.map(w => w.n), analysis: plan.analysis, copies: plan.copies, prompt: plan.imagePrompt, maker: `${modelName(TEXT_MODEL())} + ${modelName(IMAGE_MODEL())}`, image: img };
      if (sb) { const { error } = await sb.from('generations').insert(rec); if (error) throw error; }
      else await idb.put({ ...rec, id: new Date().toISOString(), at: new Date().toLocaleString('ko-KR') });
      await createPage();
    } catch (e) {
      out.innerHTML = `<p style="color:#b91c1c">만들기 실패: ${esc(e.message)}</p>`; $('#mkai').disabled = false;
    }
  };
}

function route() {
  const h = (location.hash || '#home').slice(1).split('?')[0];
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + h));
  ({ home, winners: winnersPage, analysis, ask: askPage, create: createPage, products: productsPage, ...(window.EXTRA_PAGES || {}) }[h] || home)();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
refreshKeyBadge(); route();

  }

function forgotView() {
  show(true);
  box.innerHTML = `<h1>비밀번호 찾기</h1><p class="lead">가입한 이메일로 비밀번호를 새로 정하는 링크를 보내 드립니다.</p>
  <form id="af"><label>이메일</label><input type="email" id="em" required autocomplete="username"><button class="go">링크 보내기</button>
  <button type="button" class="lk" id="back">로그인으로 돌아가기</button><div class="msg"></div></form>`;
  box.querySelector('#back').onclick = () => loginView();
  const f = box.querySelector('#af');
  f.onsubmit = async e => {
    e.preventDefault(); busy(true); msg('');
    const { error } = await sb.auth.resetPasswordForEmail(f.em.value.trim(), { redirectTo: location.origin + location.pathname });
    busy(false);
    if (error) msg(KO_ERR(error.message)); else msg('메일을 보냈습니다. 메일함(스팸함 포함)의 링크를 눌러 주세요.', true);
  };
}
function recoveryView() {
  show(true);
  box.innerHTML = `<h1>새 비밀번호 정하기</h1><p class="lead">새로 쓸 비밀번호를 넣어 주세요.</p>
  <form id="af"><label>새 비밀번호</label><input type="password" id="pw" required minlength="8" autocomplete="new-password"><p class="hint">8자 이상</p>
  <label>새 비밀번호 확인</label><input type="password" id="pw2" required minlength="8" autocomplete="new-password"><button class="go">바꾸기</button><div class="msg"></div></form>`;
  const f = box.querySelector('#af');
  f.onsubmit = async e => {
    e.preventDefault(); msg('');
    if (f.pw.value !== f.pw2.value) return msg('비밀번호 확인이 맞지 않습니다.');
    busy(true);
    const { error } = await sb.auth.updateUser({ password: f.pw.value });
    busy(false);
    if (error) return msg(KO_ERR(error.message));
    recovering = false; history.replaceState(null, '', location.pathname + '#home');
    msg('비밀번호를 바꿨습니다. 이어서 엽니다...', true);
    setTimeout(() => afterLogin(), 900);
  };
}
function pendingView(p) {
  show(true);
  box.innerHTML = `<h1>승인 대기 중</h1><p class="lead">${esc(p?.name || '')} (${esc(p?.email || me?.email || '')}) 님, 가입이 접수됐습니다.<br>관리자가 승인하면 바로 볼 수 있습니다. 승인 후 이 화면에서 새로고침해 주세요.</p>
  <button class="go" id="rf">승인됐는지 다시 확인</button><button class="lk" id="lo">로그아웃</button><div class="msg"></div>`;
  box.querySelector('#rf').onclick = () => afterLogin();
  box.querySelector('#lo').onclick = () => sb.auth.signOut();
}
async function loadProfile() {
  const { data, error } = await sb.from('profiles').select('*').eq('id', me.id).maybeSingle();
  if (error) throw error; return data;
}
async function loadData() {
  const { data, error } = await sb.from('app_data').select('key,payload');
  if (error) throw error;
  const main = data.find(r => r.key === 'main')?.payload;
  if (!main) throw new Error('자료가 없습니다.');
  const thumbs = {}; data.filter(r => r.key.startsWith('thumbs')).forEach(r => Object.assign(thumbs, r.payload));
  const products = data.find(r => r.key === 'products')?.payload || [];
  const rule = data.find(r => r.key === 'rule')?.payload;
  return { ...main, rule: rule || main.rule, thumbs, products };
}
let loginRun = null;
function afterLogin() { if (!loginRun) loginRun = afterLoginInner().finally(() => { loginRun = null; }); return loginRun; }
async function afterLoginInner() {
  if (recovering) return recoveryView();
  if (appStarted) { show(false); return; }
  box.innerHTML = `<p class="lead">자료를 불러오는 중...</p>`; show(true);
  let p;
  try { p = await loadProfile(); } catch (e) { box.innerHTML = `<p class="msg err">${esc(e.message)}</p>`; return; }
  window.ME = p;
  if (!p || !p.approved) return pendingView(p);
  if (!appStarted) {
    try { window.__GFA_DATA__ = await loadData(); } catch (e) { box.innerHTML = `<p class="msg err">자료를 못 불러왔습니다: ${esc(e.message)}</p>`; return; }
    installExtras(p);
    const s = document.createElement('script'); s.textContent = document.getElementById('appsrc').textContent; document.body.appendChild(s);
    appStarted = true;
  }
  show(false);
}

// ---------- header user box, account modal, admin page ----------
function installExtras(p) {
  if (document.querySelector('.userbox')) return;
  const top = document.querySelector('.topin');
  const ub = document.createElement('div'); ub.className = 'userbox';
  ub.innerHTML = `<span>${esc(p.name || p.email)}${p.is_admin ? ' · 관리자' : ''}</span><button id="acct">내 계정</button><button id="logout">로그아웃</button>`;
  top.appendChild(ub);
  ub.querySelector('#logout').onclick = async () => { await sb.auth.signOut(); location.hash = ''; location.reload(); };
  ub.querySelector('#acct').onclick = accountModal;
  if (p.is_admin && !document.querySelector('#tabs a[href="#admin"]')) {
    const a = document.createElement('a'); a.href = '#admin'; a.textContent = '회원 관리'; document.getElementById('tabs').appendChild(a);
  }
  window.EXTRA_PAGES = { admin: p.is_admin ? adminPage : null, account: () => { location.hash = '#home'; setTimeout(accountModal, 50); } };
}
function accountModal() {
  const p = window.ME;
  openModal(`<h2>내 계정</h2><p class="sub">${esc(p.name)} · ${esc(p.email)}${p.is_admin ? ' · 관리자' : ''}</p>
  <h2 style="margin-top:18px;font-size:16px">비밀번호 바꾸기</h2>
  <form id="cpf" style="max-width:360px">
    <p><label>지금 비밀번호<br><input type="password" id="cp0" required autocomplete="current-password" style="width:100%"></label></p>
    <p><label>새 비밀번호 (8자 이상)<br><input type="password" id="cp1" required minlength="8" autocomplete="new-password" style="width:100%"></label></p>
    <p><label>새 비밀번호 확인<br><input type="password" id="cp2" required minlength="8" autocomplete="new-password" style="width:100%"></label></p>
    <button class="pri" id="cpb">비밀번호 바꾸기</button><p id="cpm" style="font-size:13px"></p></form>`);
  const f = document.getElementById('cpf'), m = document.getElementById('cpm');
  const say = (t, ok) => { m.textContent = t; m.style.color = ok ? '#15803d' : '#b91c1c'; };
  f.onsubmit = async e => {
    e.preventDefault();
    const [a, b, c] = ['cp0', 'cp1', 'cp2'].map(id => document.getElementById(id).value);
    if (b !== c) return say('새 비밀번호 확인이 맞지 않습니다.');
    if (b.length < 8) return say('새 비밀번호는 8자 이상이어야 합니다.');
    if (a === b) return say('지금 비밀번호와 다른 비밀번호로 정해 주세요.');
    document.getElementById('cpb').disabled = true; say('확인하는 중...', true);
    const chk = await sb.auth.signInWithPassword({ email: p.email, password: a });
    if (chk.error) { document.getElementById('cpb').disabled = false; return say('지금 비밀번호가 맞지 않습니다.'); }
    const { error } = await sb.auth.updateUser({ password: b });
    document.getElementById('cpb').disabled = false;
    if (error) return say(KO_ERR(error.message));
    f.reset(); say('비밀번호를 바꿨습니다. 다음 로그인부터 새 비밀번호를 쓰세요.', true);
  };
}
async function adminPage() {
  const app = document.getElementById('app');
  app.innerHTML = `<h1>회원 관리</h1><p class="sub" style="margin-bottom:12px">가입한 사람을 승인해야 자료를 볼 수 있습니다. 승인을 취소하면 바로 못 봅니다. 승인은 관리자(나)만 할 수 있습니다.</p><div id="mlist"><p class="muted">불러오는 중...</p></div>`;
  const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
  if (error) { document.getElementById('mlist').innerHTML = `<p style="color:#b91c1c">${esc(error.message)}</p>`; return; }
  const pend = data.filter(u => !u.approved).length;
  document.getElementById('mlist').innerHTML = `<p class="muted" style="margin-bottom:8px">전체 ${data.length}명 · 승인 대기 ${pend}명</p>
  <div class="tbl"><table><thead><tr><th>이름</th><th>이메일</th><th>가입일</th><th>상태</th><th>관리</th></tr></thead><tbody>
  ${data.map(u => `<tr><td>${esc(u.name) || '-'}</td><td>${esc(u.email)}</td><td>${new Date(u.created_at).toLocaleString('ko-KR')}</td>
    <td>${u.approved ? '<span class="tag on">승인됨</span>' : '<span class="tag off">승인 대기</span>'}${u.is_admin ? ' <span class="tag p">관리자</span>' : ''}</td>
    <td>${u.id === window.ME.id ? '<span class="muted">나</span>' : `<div class="row">
      ${u.approved ? `<button data-a="unapprove" data-id="${u.id}">승인 취소</button>` : `<button class="pri" data-a="approve" data-id="${u.id}">승인</button>`}
      <button data-a="delete" data-id="${u.id}" style="color:#b91c1c">삭제</button></div>`}</td></tr>`).join('')}
  </tbody></table></div>`;
  document.querySelectorAll('#mlist [data-a]').forEach(b => b.onclick = async () => {
    const id = b.dataset.id, a = b.dataset.a;
    const patch = { approve: { approved: true, approved_at: new Date().toISOString() }, unapprove: { approved: false } }[a];
    let res;
    if (a === 'delete') { if (!confirm('이 회원을 목록에서 지울까요? 다시 보려면 새로 가입하고 승인받아야 합니다.')) return; res = await sb.from('profiles').delete().eq('id', id); }
    else res = await sb.from('profiles').update(patch).eq('id', id);
    if (res.error) alert(res.error.message);
    adminPage();
  });
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') { recovering = true; me = session?.user; return recoveryView(); }
  if (event === 'SIGNED_OUT') { me = null; if (appStarted) location.reload(); else loginView(); return; }
  if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session) {
    const first = !me; me = session.user;
    if (first || !appStarted) setTimeout(afterLogin, 0);
    return;
  }
  if (event === 'INITIAL_SESSION' && !session) loginView();
});
})();
</script>
