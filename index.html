<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>GFA 광고 스튜디오</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e4e7ec;--ink:#111827;--sub:#6b7280;--mute:#9ca3af;--acc:#16a34a;--acc2:#dcfce7;--warn:#b45309;--warnbg:#fffbeb;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:14px;line-height:1.5}
a{color:inherit}
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.topin{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;white-space:nowrap}
.brand small{font-weight:500;color:var(--sub);margin-left:6px;font-size:12px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav.tabs a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--sub);font-weight:500}
nav.tabs a.on{background:var(--ink);color:#fff}
nav.tabs a:hover:not(.on){background:#f1f2f4}
.keybadge{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);cursor:pointer;background:#fff}
.keybadge.ok{border-color:#86efac;background:var(--acc2);color:#166534}
main{max-width:1200px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em}
h2{font-size:18px;margin:0 0 12px}
.sub{color:var(--sub)}
.muted{color:var(--mute);font-size:12px}
section{margin-bottom:32px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat dt{color:var(--sub);font-size:12px}.stat dd{margin:4px 0 0;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .15s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#eee;display:block}
.cb{padding:12px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:#f1f2f4;color:#374151;white-space:nowrap}
.tag.p{background:var(--acc2);color:#166534;font-weight:600}
.tag.off{background:#fee2e2;color:#991b1b}.tag.on{background:#dbeafe;color:#1e40af}
.nm{font-weight:600;font-size:13px;word-break:break-all}
.kv{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-size:13px}
.kv b{font-size:15px}
.copy{font-size:13px;border-top:1px dashed var(--line);padding-top:6px}
.copy span{color:var(--sub);font-size:12px;display:block}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:12px}
select,input[type=text],input[type=password],textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{width:100%;resize:vertical}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#fff;padding:7px 14px}
button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
button.pri:disabled{opacity:.5;cursor:not-allowed}
button.lnk{border:none;background:none;padding:0;color:var(--blue);text-decoration:underline}
table{width:100%;border-collapse:collapse;background:#fff;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
th{background:#f9fafb;color:var(--sub);font-weight:600;font-size:12px;white-space:nowrap}
td.n,th.n{text-align:right}
.tbl{border:1px solid var(--line);border-radius:12px;overflow:auto}
.bars{display:flex;align-items:flex-end;gap:3px;height:170px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 12px 0;overflow-x:auto}
.bar{flex:1;min-width:22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer;text-decoration:none}
.bar i{display:block;width:100%;background:var(--ink);border-radius:4px 4px 0 0}
.bar:hover i{background:var(--acc)}
.bar s{text-decoration:none;font-size:10px;color:var(--sub)}
.bar u{text-decoration:none;font-size:9px;color:var(--mute);padding:4px 0;white-space:nowrap}
.heat td.h{text-align:center;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);cursor:pointer;font-size:12px}
.chip:hover{border-color:var(--ink)}
.chip b{color:var(--acc);margin-left:4px}
.notice{background:var(--warnbg);border:1px solid #fde68a;color:var(--warn);border-radius:12px;padding:12px 14px;font-size:13px}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.qa{border-bottom:1px solid var(--line);padding:12px 0}
.qa .q{font-weight:600}
.qa .a{white-space:pre-wrap;margin-top:6px;color:#1f2937}
.parsed{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.refs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.ref{border:2px solid transparent;border-radius:10px;overflow:hidden;background:#fff;cursor:pointer;position:relative}
.ref.sel{border-color:var(--acc)}
.ref img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
.ref div{font-size:11px;padding:4px 6px;line-height:1.35}
.ref .ck{position:absolute;top:6px;right:6px;background:var(--acc);color:#fff;border-radius:999px;width:20px;height:20px;display:none;align-items:center;justify-content:center;font-size:12px}
.ref.sel .ck{display:flex}
.gen img{width:100%;display:block;background:#eee}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal.show{display:flex}
.mbox{background:#fff;border-radius:14px;max-width:960px;width:100%;padding:20px;position:relative}
.mclose{position:absolute;top:10px;right:12px;border:none;background:none;font-size:22px;line-height:1}
.mgrid{display:grid;grid-template-columns:380px 1fr;gap:20px}
@media(max-width:760px){.mgrid{grid-template-columns:1fr}}
.mgrid img{width:100%;border-radius:10px;background:#eee}
tr.win td{background:#f0fdf4}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #ccc;border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
pre.prompt{white-space:pre-wrap;background:#f9fafb;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;max-height:260px;overflow:auto}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div class="brand">GFA 광고 스튜디오<small>바이랩 · 바이랩 2</small></div>
  <nav class="tabs" id="tabs">
    <a href="#home">홈</a><a href="#winners">월별 위너</a><a href="#analysis">위너 분석</a><a href="#ask">질문하기</a><a href="#create">소재 만들기</a>
  </nav>
  <span class="keybadge" id="keybadge" title="AI 연결 설정">AI 연결 안 됨</span>
</div></header>
<main id="app"></main>
<div class="modal" id="modal"><div class="mbox"><button class="mclose" id="mclose">×</button><div id="mbody"></div></div></div>

<script type="text/plain" id="appsrc">
"use strict";
const D = window.__GFA_DATA__;
const C = new Map(D.creatives.map(c => [c.n, c]));
const STATS = D.stats.map(([month, n, cost, proas, psales, pc, imp, click, roas]) => ({ month, n, cost, proas, psales, pc, imp, click, roas }));
const RULE = D.rule;
const isWin = s => s.cost >= RULE.minCost && s.proas >= RULE.minPurchaseRoas;
const SEASONS = ['봄', '여름', '가을', '겨울'];
const seasonOf = m => { const k = +m.slice(5, 7); return k >= 3 && k <= 5 ? '봄' : k >= 6 && k <= 8 ? '여름' : k >= 9 && k <= 11 ? '가을' : '겨울'; };
const W = STATS.filter(isWin).map(s => {
  const c = C.get(s.n); const t = D.imgText[s.n] || {};
  return { ...c, ...s, season: seasonOf(s.month), year: +s.month.slice(0, 4), it: t.imageText || '', vis: t.visual || '' };
}).sort((a, b) => b.month.localeCompare(a.month) || b.proas - a.proas);
// 같은 소재 = 같은 소재 번호, 또는 이미지 속 문구·광고 문구가 같은 재업로드
W.forEach(w => { w.g = w.it ? 'c:' + w.it + '|' + w.m : 'n:' + w.n; });
function groupWinners(list) {
  const m = new Map();
  for (const w of list) {
    let g = m.get(w.g);
    if (!g) { g = { ...w, rows: [], nosSet: new Set(), costSum: 0, salesSum: 0, best: 0, latest: '', anyOn: false }; m.set(w.g, g); }
    g.rows.push(w); g.nosSet.add(w.n); g.costSum += w.cost; g.salesSum += w.psales; g.anyOn = g.anyOn || w.on;
    if (w.proas > g.best) g.best = w.proas;
    if (w.month > g.latest) { g.latest = w.month; Object.assign(g, { n: w.n, nm: w.nm, a: w.a, img: w.img, cp: w.cp, as: w.as }); }
  }
  return [...m.values()].map(g => ({ ...g, on: g.anyOn, months: [...new Set(g.rows.map(r => r.month))].sort(), nos: [...g.nosSet], proasSum: g.costSum ? g.salesSum / g.costSum * 100 : 0 }));
}
const MONTHS = D.months;
const LATEST = MONTHS[MONTHS.length - 1];
const PRODUCTS = [...new Set(W.map(w => w.p))].filter(p => p !== '[확인필요]').sort();
const ALL_PRODUCTS = [...new Set(D.creatives.map(c => c.p))].sort();
const THUMB = n => D.thumbs[n] || '';
const won = x => Math.round(x).toLocaleString('ko-KR') + '원';
const man = x => (x >= 1e8 ? (x / 1e8).toFixed(1) + '억' : Math.round(x / 1e4).toLocaleString('ko-KR') + '만') + '원';
const pct = x => (Math.round(x * 10) / 10).toLocaleString('ko-KR') + '%';
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const $ = s => document.querySelector(s);
const app = $('#app');

// ---------- settings (AI key, stored only in this browser) ----------
const LS = { key: 'gfa-or-key', tm: 'gfa-text-model', im: 'gfa-image-model', qa: 'gfa-qa' };
const getKey = () => localStorage.getItem(LS.key) || '';
const TEXT_MODEL = () => localStorage.getItem(LS.tm) || 'google/gemini-3.8-flash';
const IMAGE_MODEL = () => localStorage.getItem(LS.im) || 'google/gemini-3.1-flash-image';
function refreshKeyBadge() { const b = $('#keybadge'); const ok = !!getKey(); b.textContent = ok ? 'AI 연결됨' : 'AI 연결 안 됨'; b.classList.toggle('ok', ok); }
$('#keybadge').onclick = () => openSettings();
function openSettings() {
  openModal(`<h2>AI 연결 (OpenRouter)</h2>
  <p class="sub">질문하기의 AI 답변, 소재 만들기의 카피·이미지 생성에 씁니다. 키는 <b>이 브라우저에만</b> 저장되고, 요청은 이 PC에서 OpenRouter로 바로 갑니다.</p>
  <div class="notice" style="margin:10px 0">광고 이미지와 성과 숫자가 외부 AI(OpenRouter → Google)로 전송됩니다. 회사 규정을 먼저 확인해 주세요. 키를 만들 때 사용 한도(예: 월 10달러)를 걸어 두는 걸 권합니다.</div>
  <p><label>API 키<br><input type="password" id="k1" style="width:100%" placeholder="sk-or-..." value="${esc(getKey())}"></label></p>
  <p><label>글·분석 모델<br><input type="text" id="k2" style="width:100%" value="${esc(TEXT_MODEL())}"></label></p>
  <p><label>이미지 생성 모델<br><input type="text" id="k3" style="width:100%" value="${esc(IMAGE_MODEL())}"></label></p>
  <div class="row"><button class="pri" id="ksave">저장</button><button id="kdel">키 지우기</button></div>`);
  $('#ksave').onclick = () => { localStorage.setItem(LS.key, $('#k1').value.trim()); localStorage.setItem(LS.tm, $('#k2').value.trim()); localStorage.setItem(LS.im, $('#k3').value.trim()); refreshKeyBadge(); closeModal(); route(); };
  $('#kdel').onclick = () => { localStorage.removeItem(LS.key); refreshKeyBadge(); closeModal(); route(); };
}
async function orChat(body) {
  const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method: 'POST', headers: { 'Authorization': 'Bearer ' + getKey(), 'Content-Type': 'application/json', 'X-Title': 'GFA Ad Studio' }, body: JSON.stringify(body)
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || ('요청 실패 ' + r.status));
  return j.choices[0].message;
}

// ---------- modal ----------
function openModal(html) { $('#mbody').innerHTML = html; $('#modal').classList.add('show'); }
function closeModal() { $('#modal').classList.remove('show'); }
$('#mclose').onclick = closeModal; $('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ---------- card + detail ----------
function card(w) {
  return `<article class="card" data-n="${w.n}">
    <img src="${THUMB(w.n)}" alt="${esc(w.nm)}" loading="lazy">
    <div class="cb">
      <div class="row"><span class="tag p">${esc(w.p)}</span><span class="tag">${w.month}</span><span class="tag">${esc(w.a)}</span><span class="tag ${w.on ? 'on' : 'off'}">${w.on ? 'ON' : 'OFF'}</span></div>
      <div class="nm">${esc(w.nm)}</div>
      <div class="kv"><span>구매 ROAS</span><b>${pct(w.proas)}</b></div>
      <div class="kv"><span>총 비용</span><span>${won(w.cost)}</span></div>
      <div class="copy"><span>광고 문구</span>${esc(w.m) || '<i class="muted">없음</i>'}</div>
      <div class="copy"><span>이미지 속 문구</span>${esc(w.it) || '<i class="muted">없음</i>'}</div>
    </div></article>`;
}
function groupCard(g) {
  const ms = g.months; const many = ms.length > 1;
  const shown = ms.length > 8 ? [...ms.slice(-8)] : ms;
  return `<article class="card" data-n="${g.n}">
    <img src="${THUMB(g.n)}" alt="${esc(g.nm)}" loading="lazy">
    <div class="cb">
      <div class="row"><span class="tag p">${esc(g.p)}</span><span class="tag">${esc(g.a)}</span><span class="tag ${g.on ? 'on' : 'off'}">${g.on ? 'ON' : 'OFF'}</span>${g.nos.length > 1 ? `<span class="tag" title="같은 이미지·문구로 다시 올린 소재">재업로드 ${g.nos.length}개 합침</span>` : ''}</div>
      <div class="nm">${esc(g.nm)}</div>
      <div class="row" style="gap:4px"><span class="muted">위너 ${ms.length}개월</span>${ms.length > 8 ? '<span class="muted">…</span>' : ''}${shown.map(m => `<span class="tag">${m.slice(2).replace('-', '.')}</span>`).join('')}</div>
      <div class="kv"><span>구매 ROAS${many ? ' <span class="muted">(합산)</span>' : ''}</span><b>${pct(g.proasSum)}</b></div>
      <div class="kv"><span>총 비용${many ? ' <span class="muted">(합계)</span>' : ''}</span><span>${won(g.costSum)}</span></div>
      ${many ? `<div class="kv"><span class="muted">최고 달 ROAS</span><span class="muted">${pct(g.best)}</span></div>` : ''}
      <div class="copy"><span>광고 문구</span>${esc(g.m) || '<i class="muted">없음</i>'}</div>
      <div class="copy"><span>이미지 속 문구</span>${esc(g.it) || '<i class="muted">없음</i>'}</div>
    </div></article>`;
}
function bindCards(root) { root.querySelectorAll('.card[data-n]').forEach(el => el.onclick = () => detail(+el.dataset.n)); }
function detail(n) {
  const c = C.get(n); const t = D.imgText[n] || {};
  const key = (W.find(w => w.n === n) || {}).g;
  const nos = key ? [...new Set(W.filter(w => w.g === key).map(w => w.n))] : [n];
  const multi = nos.length > 1;
  const hist = STATS.filter(s => nos.includes(s.n)).sort((a, b) => a.month.localeCompare(b.month) || a.n - b.n);
  const wins = new Set(hist.filter(isWin).map(s => s.month)).size;
  openModal(`<div class="mgrid">
    <div><img src="${esc(c.img || '')}" onerror="this.onerror=null;this.src='${THUMB(n)}'" alt="">
      <p class="muted">원본 이미지는 네이버 서버에서 불러옵니다. 안 보이면 저장된 작은 이미지로 바뀝니다.</p></div>
    <div>
      <div class="row"><span class="tag p">${esc(c.p)}</span><span class="tag">${esc(c.a)}</span><span class="tag ${c.on ? 'on' : 'off'}">${c.on ? 'ON' : 'OFF'}</span><span class="tag">위너 ${wins}개월</span></div>
      <h2 style="margin-top:8px">${esc(c.nm)}</h2>
      <p class="muted">${esc(c.cp)} › ${esc(c.as)}${c.at ? ' · 만든 날 ' + c.at : ''}</p>
      <p><b>광고 문구</b><br>${esc(c.m) || '-'}</p>
      <p><b>이미지 속 문구</b><br>${esc(t.imageText) || '-'}</p>
      <p><b>이미지 특징</b><br>${esc(t.visual) || '-'}</p>
      ${multi ? `<p class="notice" style="padding:8px 10px">같은 이미지·문구로 다시 올린 소재 ${nos.length}개를 합쳐 보여 줍니다: ${nos.map(x => esc(C.get(x).nm) + ' (' + esc(C.get(x).as) + ')').join(', ')}</p>` : ''}
      ${c.link ? `<p><a href="${esc(c.link)}" target="_blank" rel="noopener">연결된 상품 페이지 열기</a></p>` : ''}
      <button class="pri" id="mkfrom">이 소재를 참고해 시안 만들기</button>
    </div></div>
    <h2 style="margin-top:18px">월별 성과</h2>
    <div class="tbl"><table><thead><tr><th>월</th>${multi ? '<th>소재</th>' : ''}<th class="n">총 비용</th><th class="n">구매완료 광고수익률</th><th class="n">구매 매출</th><th class="n">구매 수</th><th class="n">노출</th><th class="n">클릭</th><th>위너</th></tr></thead><tbody>
    ${hist.map(s => `<tr class="${isWin(s) ? 'win' : ''}"><td>${s.month}</td>${multi ? `<td style="font-size:12px">${esc(C.get(s.n).nm)}</td>` : ''}<td class="n">${won(s.cost)}</td><td class="n">${pct(s.proas)}</td><td class="n">${won(s.psales)}</td><td class="n">${s.pc}</td><td class="n">${s.imp.toLocaleString()}</td><td class="n">${s.click.toLocaleString()}</td><td>${isWin(s) ? '위너' : ''}</td></tr>`).join('')}
    </tbody></table></div>`);
  $('#mkfrom').onclick = () => { closeModal(); createState.product = c.p; createState.refs = [n]; location.hash = '#create'; };
}

// ---------- HOME ----------
function home() {
  const latestW = groupWinners(W.filter(w => w.month === LATEST)).sort((a, b) => b.proasSum - a.proasSum);
  const prevMonth = MONTHS[MONTHS.length - 2];
  const bestProd = Object.entries(W.reduce((o, w) => (o[w.p] = (o[w.p] || 0) + 1, o), {})).sort((a, b) => b[1] - a[1])[0];
  app.innerHTML = `
  <section>
    <p class="sub">디스플레이 광고 · 웹사이트 전환 · 이름에 「피드」가 들어간 캠페인 · ON/OFF 소재 모두</p>
    <h1>GFA 광고 스튜디오</h1>

const PWORDS = [...ALL_PRODUCTS.filter(p => p !== '[확인필요]').map(p => [p, p]), ['귀', '이어클리너'], ['눈곱', '아이클리너'], ['눈물', '아이클리너'], ['양치', '덴탈스프레이'], ['덴탈', '덴탈스프레이'], ['발샴푸', '수분풋케어'], ['발바닥', '수딩풋에센스'], ['풋', '수분풋케어'], ['얼굴', '페이스클렌징'], ['세수', '페이스클렌징'], ['모래', '고양이모래'], ['샴푸', '스킨테라피'], ['인공눈물', '아이드롭']];
function parseQ(q) {
  const now = new Date(); const cy = now.getFullYear();
  const f = { products: [], months: null, accounts: [], seasons: [], top: null, notes: [] };
  // products: exact names first, then hints
  const exact = ALL_PRODUCTS.filter(p => q.includes(p));
  if (exact.length) f.products = exact; else { const h = PWORDS.find(([w]) => q.includes(w)); if (h) { f.products = [h[1]]; f.notes.push(`「${h[0]}」 → ${h[1]}`); } }

  for (const m of q.matchAll(/(?:^|\D)(\d{2})\s*년/g)) years.push(2000 + +m[1]);

  else for (const m of q.matchAll(/(\d{1,2})\s*월/g)) mons.push(+m[1]);

  if (q.includes('이번 달') || q.includes('이번달')) f.months = [LATEST];
  else if (q.includes('지난달') || q.includes('지난 달')) f.months = [MONTHS[MONTHS.length - 2]];
  else if (mons.length || ys || f.seasons.length) {
    f.months = MONTHS.filter(m => {
      const y = +m.slice(0, 4), k = +m.slice(5);
      if (f.seasons.length && ys) {
        // 겨울 of year Y = Y-12 + (Y+1)-01,02
        return f.seasons.some(s => s === '겨울' ? ys.some(Y => (y === Y && k === 12) || (y === Y + 1 && k <= 2)) : ys.includes(y) && seasonOf(m) === s);
      }
      if (f.seasons.length && !f.seasons.includes(seasonOf(m))) return false;
      if (ys && !ys.includes(y)) return false;
      if (mons.length && !mons.includes(k)) return false;

  if (/already registered|already been registered/i.test(m)) return '이미 가입된 이메일입니다. 로그인해 주세요.';
  if (/at least|Password should be/i.test(m)) return '비밀번호는 8자 이상이어야 합니다.';
  if (/rate limit|too many/i.test(m)) return '요청이 너무 많습니다. 잠시 뒤 다시 해 주세요.';
  if (/valid email|invalid.*email/i.test(m)) return '이메일 주소 형식을 확인해 주세요.';
  if (/same.*password|different from the old/i.test(m)) return '지금 비밀번호와 다른 비밀번호로 정해 주세요.';
  return m;
};
let recovering = /type=recovery/.test(location.hash);
let appStarted = false;
let me = null;

function show(on) { document.getElementById('auth').style.display = on ? 'flex' : 'none'; document.body.classList.toggle('locked', on); }
function msg(t, ok) { const el = box.querySelector('.msg'); if (el) { el.textContent = t; el.className = 'msg ' + (ok ? 'ok' : 'err'); } }
function busy(b) { const g = box.querySelector('.go'); if (g) g.disabled = b; }

function loginView(tab = 'login', note = '') {
  show(true);
  box.innerHTML = `<h1>GFA 광고 스튜디오</h1><p class="lead">바이랩 마케팅팀 전용입니다. 가입 후 관리자가 승인하면 볼 수 있습니다.</p>
  <div class="at"><button data-t="login" class="${tab === 'login' ? 'on' : ''}">로그인</button><button data-t="signup" class="${tab === 'signup' ? 'on' : ''}">회원가입</button></div>
  <form id="af">${tab === 'login' ? `
    <label>이메일</label><input type="email" id="em" autocomplete="username" required>
    <label>비밀번호</label><input type="password" id="pw" autocomplete="current-password" required>
    <button class="go">로그인</button>
    <button type="button" class="lk" id="forgot">비밀번호를 잊으셨나요?</button>` : `
    <label>이름</label><input type="text" id="nm" autocomplete="name" required placeholder="홍길동">
    <label>이메일</label><input type="email" id="em" autocomplete="username" required>
    <label>비밀번호</label><input type="password" id="pw" autocomplete="new-password" required minlength="8">
    <p class="hint">8자 이상</p>
    <label>비밀번호 확인</label><input type="password" id="pw2" autocomplete="new-password" required minlength="8">
    <button class="go">가입하기</button>`}
    <div class="msg ${note ? 'ok' : ''}">${esc(note)}</div></form>`;
  box.querySelectorAll('[data-t]').forEach(b => b.onclick = () => loginView(b.dataset.t));
  const f = box.querySelector('#af');
  if (tab === 'login') {
    box.querySelector('#forgot').onclick = forgotView;
    f.onsubmit = async e => {
      e.preventDefault(); busy(true); msg('');
      const { error } = await sb.auth.signInWithPassword({ email: f.em.value.trim(), password: f.pw.value });
      busy(false); if (error) msg(KO_ERR(error.message));
    };
  } else {
    f.onsubmit = async e => {
      e.preventDefault(); msg('');
      if (f.pw.value !== f.pw2.value) return msg('비밀번호 확인이 맞지 않습니다.');
      if (f.pw.value.length < 8) return msg('비밀번호는 8자 이상이어야 합니다.');
      busy(true);
      const { error } = await sb.auth.signUp({ email: f.em.value.trim(), password: f.pw.value, options: { data: { name: f.nm.value.trim() } } });
      busy(false); if (error) msg(KO_ERR(error.message));
    };
  }
}
function forgotView() {
  show(true);
  box.innerHTML = `<h1>비밀번호 찾기</h1><p class="lead">가입한 이메일로 비밀번호를 새로 정하는 링크를 보내 드립니다.</p>
  <form id="af"><label>이메일</label><input type="email" id="em" required autocomplete="username"><button class="go">링크 보내기</button>
  <button type="button" class="lk" id="back">로그인으로 돌아가기</button><div class="msg"></div></form>`;
  box.querySelector('#back').onclick = () => loginView();
  const f = box.querySelector('#af');
  f.onsubmit = async e => {
    e.preventDefault(); busy(true); msg('');
    const { error } = await sb.auth.resetPasswordForEmail(f.em.value.trim(), { redirectTo: location.origin + location.pathname });
    busy(false);
    if (error) msg(KO_ERR(error.message)); else msg('메일을 보냈습니다. 메일함(스팸함 포함)의 링크를 눌러 주세요.', true);
  };
}
function recoveryView() {
  show(true);
  box.innerHTML = `<h1>새 비밀번호 정하기</h1><p class="lead">새로 쓸 비밀번호를 넣어 주세요.</p>
  <form id="af"><label>새 비밀번호</label><input type="password" id="pw" required minlength="8" autocomplete="new-password"><p class="hint">8자 이상</p>
  <label>새 비밀번호 확인</label><input type="password" id="pw2" required minlength="8" autocomplete="new-password"><button class="go">바꾸기</button><div class="msg"></div></form>`;
  const f = box.querySelector('#af');
  f.onsubmit = async e => {
    e.preventDefault(); msg('');
    if (f.pw.value !== f.pw2.value) return msg('비밀번호 확인이 맞지 않습니다.');
    busy(true);
    const { error } = await sb.auth.updateUser({ password: f.pw.value });
    busy(false);
    if (error) return msg(KO_ERR(error.message));
    recovering = false; history.replaceState(null, '', location.pathname + '#home');
    msg('비밀번호를 바꿨습니다. 이어서 엽니다...', true);
    setTimeout(() => afterLogin(), 900);
  };
}
function pendingView(p) {
  show(true);
  box.innerHTML = `<h1>승인 대기 중</h1><p class="lead">${esc(p?.name || '')} (${esc(p?.email || me?.email || '')}) 님, 가입이 접수됐습니다.<br>관리자가 승인하면 바로 볼 수 있습니다. 승인 후 이 화면에서 새로고침해 주세요.</p>
  <button class="go" id="rf">승인됐는지 다시 확인</button><button class="lk" id="lo">로그아웃</button><div class="msg"></div>`;
  box.querySelector('#rf').onclick = () => afterLogin();
  box.querySelector('#lo').onclick = () => sb.auth.signOut();
}
async function loadProfile() {
  const { data, error } = await sb.from('profiles').select('*').eq('id', me.id).maybeSingle();
  if (error) throw error; return data;
}
async function loadData() {
  const { data, error } = await sb.from('app_data').select('key,payload');
  if (error) throw error;
  const main = data.find(r => r.key === 'main')?.payload;
  if (!main) throw new Error('자료가 없습니다.');
  const thumbs = {}; data.filter(r => r.key.startsWith('thumbs')).forEach(r => Object.assign(thumbs, r.payload));
  return { ...main, thumbs };
}
async function afterLogin() {
  if (recovering) return recoveryView();
  box.innerHTML = `<p class="lead">자료를 불러오는 중...</p>`; show(true);
  let p;
  try { p = await loadProfile(); } catch (e) { box.innerHTML = `<p class="msg err">${esc(e.message)}</p>`; return; }
  window.ME = p;
  if (!p || !p.approved) return pendingView(p);
  if (!appStarted) {
    try { window.__GFA_DATA__ = await loadData(); } catch (e) { box.innerHTML = `<p class="msg err">자료를 못 불러왔습니다: ${esc(e.message)}</p>`; return; }
    installExtras(p);
    const s = document.createElement('script'); s.textContent = document.getElementById('appsrc').textContent; document.body.appendChild(s);
    appStarted = true;
  }
  show(false);
}

// ---------- header user box, account modal, admin page ----------
function installExtras(p) {
  const top = document.querySelector('.topin');
  const ub = document.createElement('div'); ub.className = 'userbox';
  ub.innerHTML = `<span>${esc(p.name || p.email)}${p.is_admin ? ' · 관리자' : ''}</span><button id="acct">내 계정</button><button id="logout">로그아웃</button>`;
  top.appendChild(ub);
  ub.querySelector('#logout').onclick = async () => { await sb.auth.signOut(); location.hash = ''; location.reload(); };
  ub.querySelector('#acct').onclick = accountModal;
  if (p.is_admin) {
    const a = document.createElement('a'); a.href = '#admin'; a.textContent = '회원 관리'; document.getElementById('tabs').appendChild(a);
  }
  window.EXTRA_PAGES = { admin: p.is_admin ? adminPage : null, account: () => { location.hash = '#home'; setTimeout(accountModal, 50); } };
}
function accountModal() {
  const p = window.ME;
  openModal(`<h2>내 계정</h2><p class="sub">${esc(p.name)} · ${esc(p.email)}${p.is_admin ? ' · 관리자' : ''}</p>
  <h2 style="margin-top:18px;font-size:16px">비밀번호 바꾸기</h2>
  <form id="cpf" style="max-width:360px">
    <p><label>지금 비밀번호<br><input type="password" id="cp0" required autocomplete="current-password" style="width:100%"></label></p>
    <p><label>새 비밀번호 (8자 이상)<br><input type="password" id="cp1" required minlength="8" autocomplete="new-password" style="width:100%"></label></p>
    <p><label>새 비밀번호 확인<br><input type="password" id="cp2" required minlength="8" autocomplete="new-password" style="width:100%"></label></p>
    <button class="pri" id="cpb">비밀번호 바꾸기</button><p id="cpm" style="font-size:13px"></p></form>`);
  const f = document.getElementById('cpf'), m = document.getElementById('cpm');
  const say = (t, ok) => { m.textContent = t; m.style.color = ok ? '#15803d' : '#b91c1c'; };
  f.onsubmit = async e => {
    e.preventDefault();
    const [a, b, c] = ['cp0', 'cp1', 'cp2'].map(id => document.getElementById(id).value);
    if (b !== c) return say('새 비밀번호 확인이 맞지 않습니다.');
    if (b.length < 8) return say('새 비밀번호는 8자 이상이어야 합니다.');
    if (a === b) return say('지금 비밀번호와 다른 비밀번호로 정해 주세요.');
    document.getElementById('cpb').disabled = true; say('확인하는 중...', true);
    const chk = await sb.auth.signInWithPassword({ email: p.email, password: a });
    if (chk.error) { document.getElementById('cpb').disabled = false; return say('지금 비밀번호가 맞지 않습니다.'); }
    const { error } = await sb.auth.updateUser({ password: b });
    document.getElementById('cpb').disabled = false;
    if (error) return say(KO_ERR(error.message));
    f.reset(); say('비밀번호를 바꿨습니다. 다음 로그인부터 새 비밀번호를 쓰세요.', true);
  };
}
async function adminPage() {
  const app = document.getElementById('app');
  app.innerHTML = `<h1>회원 관리</h1><p class="sub" style="margin-bottom:12px">가입한 사람을 승인해야 자료를 볼 수 있습니다. 승인을 취소하면 바로 못 봅니다. 승인은 관리자(나)만 할 수 있습니다.</p><div id="mlist"><p class="muted">불러오는 중...</p></div>`;
  const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
  if (error) { document.getElementById('mlist').innerHTML = `<p style="color:#b91c1c">${esc(error.message)}</p>`; return; }
  const pend = data.filter(u => !u.approved).length;
  document.getElementById('mlist').innerHTML = `<p class="muted" style="margin-bottom:8px">전체 ${data.length}명 · 승인 대기 ${pend}명</p>
  <div class="tbl"><table><thead><tr><th>이름</th><th>이메일</th><th>가입일</th><th>상태</th><th>관리</th></tr></thead><tbody>
  ${data.map(u => `<tr><td>${esc(u.name) || '-'}</td><td>${esc(u.email)}</td><td>${new Date(u.created_at).toLocaleString('ko-KR')}</td>
    <td>${u.approved ? '<span class="tag on">승인됨</span>' : '<span class="tag off">승인 대기</span>'}${u.is_admin ? ' <span class="tag p">관리자</span>' : ''}</td>
    <td>${u.id === window.ME.id ? '<span class="muted">나</span>' : `<div class="row">
      ${u.approved ? `<button data-a="unapprove" data-id="${u.id}">승인 취소</button>` : `<button class="pri" data-a="approve" data-id="${u.id}">승인</button>`}
      <button data-a="delete" data-id="${u.id}" style="color:#b91c1c">삭제</button></div>`}</td></tr>`).join('')}
  </tbody></table></div>`;
  document.querySelectorAll('#mlist [data-a]').forEach(b => b.onclick = async () => {
    const id = b.dataset.id, a = b.dataset.a;
    const patch = { approve: { approved: true, approved_at: new Date().toISOString() }, unapprove: { approved: false } }[a];
    let res;
    if (a === 'delete') { if (!confirm('이 회원을 목록에서 지울까요? 다시 보려면 새로 가입하고 승인받아야 합니다.')) return; res = await sb.from('profiles').delete().eq('id', id); }
    else res = await sb.from('profiles').update(patch).eq('id', id);
    if (res.error) alert(res.error.message);
    adminPage();
  });
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') { recovering = true; me = session?.user; return recoveryView(); }
  if (event === 'SIGNED_OUT') { me = null; if (appStarted) location.reload(); else loginView(); return; }
  if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session) {
    const first = !me; me = session.user;
    if (first || !appStarted) setTimeout(afterLogin, 0);
    return;
  }
  if (event === 'INITIAL_SESSION' && !session) loginView();
});
})();
</script>

</body>
