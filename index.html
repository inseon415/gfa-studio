<title>닥터바이랩 광고 소재</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--line:#e4e7ec;--ink:#111827;--sub:#6b7280;--mute:#9ca3af;--acc:#16a34a;--acc2:#dcfce7;--warn:#b45309;--warnbg:#fffbeb;--blue:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:14px;line-height:1.5}
a{color:inherit}
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.topin{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;white-space:nowrap}
.brand small{font-weight:500;color:var(--sub);margin-left:6px;font-size:12px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav.tabs a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--sub);font-weight:500}
nav.tabs a.on{background:var(--ink);color:#fff}

.fat-row>img{width:56px;height:56px;object-fit:cover;border-radius:8px;flex:none;background:#eef0f3}
.fr-main{flex:1;min-width:0}.fr-nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:3px 0 1px}
.fr-trend{text-align:center;flex:none}.spark{width:90px;height:32px;display:block}
.mkalt{flex:none;font-size:12px;padding:6px 10px;white-space:nowrap}
.tag.warnt{background:#fde8e1;color:#c2410c}.tag.cautt{background:#fff4d6;color:#8a5a00}
.htwo>*{min-width:0;overflow:hidden}.sboard>*{min-width:0}.hbox .row{flex-wrap:wrap}
.revbtn{font-size:12px;padding:5px 10px;border-color:var(--brand);color:var(--deep);background:#fff}.revbtn:hover{background:var(--acc2)}
.revgrid{display:grid;grid-template-columns:320px 1fr;gap:18px}.revgrid>img{width:100%;border-radius:10px}@media(max-width:760px){.revgrid{grid-template-columns:1fr}}
.revlabel{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:10px 0 4px}.revgrid textarea{width:100%}
.histgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.histitem img{width:100%;border-radius:10px;border:1px solid var(--line)}
.plinfo{margin-top:10px;background:var(--acc2);border-radius:8px;padding:8px 12px;font-size:13px}
.unklist{display:flex;flex-direction:column;margin-top:10px}.unkrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #eef0f3}.unkrow.picked{background:var(--acc2)}
.unkrow>img{width:96px;height:64px;object-fit:contain;background:#f3f5f8;border-radius:6px;flex:none}.ur-main{flex:1;min-width:0}.unksel{flex:none;min-width:170px}
.imgbox{position:relative;width:100%;aspect-ratio:1/1;background:#eef2f7;overflow:hidden}
.imgbox img{width:100%;height:100%;display:block;object-fit:contain;aspect-ratio:auto !important;background:none !important}
.imgbox.sq img{object-fit:cover}
.fitfmt .imgbox{aspect-ratio:var(--ar)}
.fitfmt .imgbox img{object-fit:cover}
.topgrid.cols3,.grid.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
.topgrid.cols2,.grid.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:760px){.topgrid.cols3,.grid.cols3,.topgrid.cols2,.grid.cols2{grid-template-columns:1fr}}
.topcard .timg .imgbox img{aspect-ratio:auto}
.ref .imgbox{aspect-ratio:1/1}
/* 상단 브랜드 로고 탭 */
.brand{gap:0}
.brand .bl{display:flex;align-items:center;height:36px;padding:0 12px;border-radius:8px;cursor:pointer;opacity:.55;transition:opacity .15s,background .15s}
.brand .bl img{height:20px;width:auto;display:block}
.brand .bl:hover{opacity:.9;background:rgba(255,255,255,.12)}
.brand .bl.on{opacity:1;background:rgba(255,255,255,.18);box-shadow:inset 0 -2px 0 #fff}
.brand .bsep{width:1px;height:22px;background:rgba(255,255,255,.45);margin:0 6px}
.pbox .noimg{color:var(--mute);font-size:13px;text-align:center;line-height:1.5}
/* 닥터바이 테마 (Dr.BY 그린 #0D5440) */
body.brand-drby{--navy:#0d5440;--navy2:#0a4636;--acc:#1f8a63;--acc-d:#0d5440;--acc2:#e3f2ea;--brand:#0d5440;--deep:#083a2c;--pos:#0d5440;--pos2:#e3f2ea;--blue:#0d6b4f}
body.brand-drby header.top{background:#0d5440;box-shadow:0 2px 10px rgba(8,58,44,.22)}
body.brand-drby .studio-hero{background:linear-gradient(120deg,#083a2c 0%,#0d5440 55%,#2f8a68 100%)}
body.brand-drby .studio-hero .eyebrow{color:#bfe8d5}
body.brand-drby .studio-hero .sub{color:#d3eee2}
body.brand-drby .stat:nth-child(2){border-top-color:#6fbf9c}body.brand-drby .stat:nth-child(4){border-top-color:#a6dcc3}
body.brand-drby tr.win td{background:#edf8f2}
body.brand-drby .bar i{background:#b5dcc9}
body.brand-drby .dl.up{color:#0d6b4f}
body.brand-drby .galtab.on b{color:#bfe8d5}
body.brand-drby .rank.r1{background:#0d5440}
body.brand-drby .topcard.podium{border-color:#a6dcc3}
body.brand-drby main a{color:#0d6b4f}body.brand-drby .studio-hero a.fs-link{color:#fff}
body.brand-drby .keybadge.ok{color:#083a2c}
/* 두 로고 글자 높이 맞춤: BY LAB 은 위에 + 가 있어 글자가 이미지 높이의 66%, Dr.BY 는 거의 100% */
.brand .bl img.lg-by{height:24px;transform:translateY(-4px)}.brand .bl img.lg-dr{height:16px}
/* 시안 갤러리: 이미지 전체 보기 + 확대 */
.gen .gimg{position:relative;aspect-ratio:var(--gar,1/1);background:#f1f3f6;display:flex;align-items:center;justify-content:center;cursor:zoom-in;overflow:hidden;border-bottom:1px solid var(--line)}
.gen .gimg img{width:100%;height:100%;object-fit:contain;aspect-ratio:auto;background:transparent;display:block}
.gen .gimg .zhint{position:absolute;right:10px;bottom:10px;background:rgba(15,23,42,.72);color:#fff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;opacity:0;transition:opacity .15s}
.gen .gimg:hover .zhint{opacity:1}
img.zoomable{cursor:zoom-in}
#zoombox{position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.78);display:none;align-items:center;justify-content:center;padding:32px}
#zoombox.show{display:flex}
#zoombox .zin{position:relative;background:#fff;border-radius:14px;padding:18px 18px 12px;max-width:calc(100vw - 64px);max-height:calc(100vh - 64px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#zoombox .zimg{background:repeating-conic-gradient(#f1f3f6 0 25%,#fff 0 50%) 0 0/16px 16px;border-radius:8px;overflow:auto;display:flex;align-items:center;justify-content:center}
#zoombox .zimg img{display:block;max-width:calc(100vw - 100px);max-height:calc(100vh - 140px);width:auto;height:auto}
#zoombox .zcap{margin-top:10px;font-size:13px;color:#475569;text-align:center}
#zoombox .zx{position:absolute;top:-14px;right:-14px;width:32px;height:32px;border-radius:50%;border:0;background:#fff;color:#0f172a;font-size:15px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.25);cursor:pointer;padding:0}
/* 갤러리 필터 2줄 (제품 / 지면) */
.galfilter{display:flex;align-items:flex-start;gap:10px;margin:0 0 8px}
.galfilter .gfl{flex:0 0 36px;font-size:13px;font-weight:700;color:#475569;line-height:34px}
.galfilter .galtabs{margin:0}
.galfilter+.galfilter{margin-bottom:16px}
.galtab.zero{opacity:.45}
#galgrid.wide{grid-template-columns:repeat(auto-fill,minmax(420px,1fr))}
/* 소재 만들기 폼: 라벨 폭 고정으로 선택 칸 왼쪽선 맞춤 */
.frow{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.frow .fl{flex:0 0 66px;font-weight:600;font-size:14px}
.frow select{width:300px;max-width:100%}
.gen .gspec{font-size:13px;font-weight:600;color:#334155}
.unkbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:12px 0 4px;font-size:13px}
#unkbarBot{margin:12px 0 0}
.unkbar .pgsize{display:flex;align-items:center;gap:6px;color:#475569}
.unkbar .pgsize select{height:32px;padding:0 8px}
.unkbar .pgrange{color:#64748b;font-variant-numeric:tabular-nums}
.unkbar .pgnav{display:flex;align-items:center;gap:4px;margin-left:auto}
.unkbar .pg{min-width:32px;height:32px;padding:0 10px;border:1px solid #d7dce3;border-radius:6px;background:#fff;color:#334155;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.unkbar .pg.on{background:var(--navy);border-color:var(--navy);color:#fff}
.unkbar .pg:disabled{opacity:.4;cursor:default}
.unkbar .pgdots{color:#94a3b8;padding:0 2px}
</style>

async function orChat(body) {

}

    $('#galgrid').querySelectorAll('[data-rev]').forEach(el => el.onclick = () => openRevision(gens.find(x => x.id === el.dataset.rev)));

      box.querySelectorAll('[data-rr]').forEach(el => el.onclick = () => { const n = +el.dataset.rr; const i = createState.rrefs.indexOf(n); if (i >= 0) createState.rrefs.splice(i, 1); else if (createState.rrefs.length < 3) createState.rrefs.push(n); else return alert('베스트 리뷰는 3개까지 고를 수 있어요.'); el.classList.toggle('sel', createState.rrefs.includes(n)); $('#rrc').textContent = createState.rrefs.length; });

  const refsSel = () => createState.refs.map(n => refsAll.find(w => w.n === n)).filter(Boolean);
  $('#mkreq').onclick = async () => {

    try {

{"analysis":"위너들의 공통점 2~3문장","copies":[{"imageText":"이미지 속 문구","adMessage":"광고 문구"} x3],"imagePrompt":"이미지 생성 모델에 줄 영어 지시문. 첫 번째 copies의 imageText를 한글 그대로 이미지에 크게 넣으라고 명시"}`;
      const content = [{ type: 'text', text: `제품: ${p}${pi ? ` (${pi.label}${pi.size ? ' ' + pi.size : ''}, 용기: ${pi.look})` : ''}\n크기: 1200x1200 정사각형 (네이버 GFA 피드형)\n${dir ? '추가 방향: ' + dir + '\n' : ''}${pi ? '첫 번째 이미지는 실제 제품(단상자·용기) 사진이다. 나머지는 위너 소재다.\n' : ''}[위너 소재]\n` + refs.map((w, i) => `${i + 1}. 이미지 속 문구: ${w.it || '-'} / 광고 문구: ${w.m || '-'} / 특징: ${w.vis || '-'} / 구매 ROAS ${pct(w.proas)}`).join('\n') }]

function route() {

  <div class="at"><button data-t="login" class="${tab === 'login' ? 'on' : ''}">로그인</button><button data-t="signup" class="${tab === 'signup' ? 'on' : ''}">회원가입</button></div>
  <form id="af">${tab === 'login' ? `
    <label>이메일</label><input type="email" id="em" autocomplete="username" required>
    <label>비밀번호</label><input type="password" id="pw" autocomplete="current-password" required>
    <button class="go">로그인</button>
    <button type="button" class="lk" id="forgot">비밀번호를 잊으셨나요?</button>` : `
    <label>이름</label><input type="text" id="nm" autocomplete="name" required placeholder="홍길동">
    <label>이메일</label><input type="email" id="em" autocomplete="username" required>
    <label>비밀번호</label><input type="password" id="pw" autocomplete="new-password" required minlength="8">
    <p class="hint">8자 이상</p>
    <label>비밀번호 확인</label><input type="password" id="pw2" autocomplete="new-password" required minlength="8">
    <button class="go">가입하기</button>`}
    <div class="msg ${note ? 'ok' : ''}">${esc(note)}</div></form>`;
  box.querySelectorAll('[data-t]').forEach(b => b.onclick = () => loginView(b.dataset.t));
  const f = box.querySelector('#af');
  if (tab === 'login') {
    box.querySelector('#forgot').onclick = forgotView;
    f.onsubmit = async e => {
      e.preventDefault(); busy(true); msg('');
      const { error } = await sb.auth.signInWithPassword({ email: f.em.value.trim(), password: f.pw.value });
      busy(false); if (error) msg(KO_ERR(error.message));
    };
  } else {
    f.onsubmit = async e => {
      e.preventDefault(); msg('');
      if (f.pw.value !== f.pw2.value) return msg('비밀번호 확인이 맞지 않습니다.');
      if (f.pw.value.length < 8) return msg('비밀번호는 8자 이상이어야 합니다.');
      busy(true);
      const { error } = await sb.auth.signUp({ email: f.em.value.trim(), password: f.pw.value, options: { data: { name: f.nm.value.trim() } } });
      busy(false); if (error) msg(KO_ERR(error.message));
    };
  }
}
function forgotView() {
  show(true);
  box.innerHTML = `<h1>비밀번호 찾기</h1><p class="lead">가입한 이메일로 비밀번호를 새로 정하는 링크를 보내 드립니다.</p>
  <form id="af"><label>이메일</label><input type="email" id="em" required autocomplete="username"><button class="go">링크 보내기</button>
  <button type="button" class="lk" id="back">로그인으로 돌아가기</button><div class="msg"></div></form>`;
  box.querySelector('#back').onclick = () => loginView();
  const f = box.querySelector('#af');
  f.onsubmit = async e => {
    e.preventDefault(); busy(true); msg('');
    const { error } = await sb.auth.resetPasswordForEmail(f.em.value.trim(), { redirectTo: location.origin + location.pathname });
    busy(false);
    if (error) msg(KO_ERR(error.message)); else msg('메일을 보냈습니다. 메일함(스팸함 포함)의 링크를 눌러 주세요.', true);
  };
}
function recoveryView() {
  show(true);
  box.innerHTML = `<h1>새 비밀번호 정하기</h1><p class="lead">새로 쓸 비밀번호를 넣어 주세요.</p>
  <form id="af"><label>새 비밀번호</label><input type="password" id="pw" required minlength="8" autocomplete="new-password"><p class="hint">8자 이상</p>
  <label>새 비밀번호 확인</label><input type="password" id="pw2" required minlength="8" autocomplete="new-password"><button class="go">바꾸기</button><div class="msg"></div></form>`;
  const f = box.querySelector('#af');
  f.onsubmit = async e => {
    e.preventDefault(); msg('');
    if (f.pw.value !== f.pw2.value) return msg('비밀번호 확인이 맞지 않습니다.');
    busy(true);
    const { error } = await sb.auth.updateUser({ password: f.pw.value });
    busy(false);
    if (error) return msg(KO_ERR(error.message));

async function loadProfile() {
  const { data, error } = await sb.from('profiles').select('*').eq('id', me.id).maybeSingle();
  if (error) throw error; return data;
}
// 자료는 이 기기(IndexedDB)에 보관해 두고, 서버에서 바뀐 조각(updated_at 이 다른 것)만 새로 받는다.
const kv = (() => {
  let dbp; const open = () => dbp ||= new Promise((res, rej) => { const r = indexedDB.open('gfa-cache', 1); r.onupgradeneeded = () => r.result.createObjectStore('app_data'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('app_data', mode); const st = t.objectStore('app_data'); const out = fn(st); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); }); };
  return { get: k => tx('readonly', s => s.get(k)), put: (k, v) => tx('readwrite', s => s.put(v, k)), del: k => tx('readwrite', s => s.delete(k)), keys: () => tx('readonly', s => s.getAllKeys()) };
})();
window.__kv = kv;
async function loadData(brand) {
  const idx = await sb.from('app_data').select('key,updated_at');
  if (idx.error) throw idx.error;
  const wantRow = r => !r.key.startsWith('reviews_') && (!r.key.startsWith('thumbs') || (brand === 'drby' ? r.key.startsWith('thumbs_dr_') : !r.key.startsWith('thumbs_dr_')));
  const want = idx.data.filter(wantRow);
  const got = {}; const need = [];
  let cacheOk = true;
  await Promise.all(want.map(async r => { try { const c = await kv.get(r.key); if (c && c.u === r.updated_at) got[r.key] = c.p; else need.push(r.key); } catch { cacheOk = false; need.push(r.key); } }));
  // 바뀐 조각만 3개씩 나눠 동시에 받는다
  const chunks = []; for (let i = 0; i < need.length; i += 3) chunks.push(need.slice(i, i + 3));
  let done = 0; const lead = document.querySelector('#authbox .lead');
  const pool = async () => { while (chunks.length) { const ks = chunks.shift(); const { data, error } = await sb.from('app_data').select('key,payload,updated_at').in('key', ks); if (error) throw error; for (const r of data) { got[r.key] = r.payload; if (cacheOk) kv.put(r.key, { u: r.updated_at, p: r.payload }).catch(() => {}); } done += ks.length; if (lead && need.length > 3) lead.textContent = `자료를 받는 중... ${Math.round(done / need.length * 100)}% (처음 한 번만 오래 걸려요)`; } };
  await Promise.all([pool(), pool(), pool(), pool()]);
  // 서버에서 없어진 조각은 기기에서도 지운다
  try { const live = new Set(idx.data.map(r => r.key)); for (const k of await kv.keys()) if (!String(k).startsWith('gen:') && !live.has(k)) kv.del(k).catch(() => {}); } catch {}
  const data = want.map(r => ({ key: r.key, payload: got[r.key] })).filter(r => r.payload !== undefined);
  const main = data.find(r => r.key === 'main')?.payload;
  if (main && !main.creatives) main.creatives = data.filter(r => /^cre_\d+$/.test(r.key)).sort((a, b) => +a.key.slice(4) - +b.key.slice(4)).flatMap(r => r.payload);
  if (!main) throw new Error('자료가 없습니다.');
  const thumbs = {}; data.filter(r => r.key.startsWith('thumbs')).forEach(r => Object.assign(thumbs, r.payload));
  const products = data.find(r => r.key === 'products')?.payload || [];
  const rule = data.find(r => r.key === 'rule')?.payload;
  const productOverrides = data.find(r => r.key === 'product_overrides')?.payload || {};
  const productsDr = data.find(r => r.key === 'products_drby')?.payload || [];
  const ruleDr = data.find(r => r.key === 'rule_drby')?.payload;
  return { ...main, rule: rule || main.rule, ruleDr: ruleDr || rule || main.rule, thumbs, products, productsDr, productOverrides };
}
let loginRun = null;
function afterLogin() { if (!loginRun) loginRun = afterLoginInner().finally(() => { loginRun = null; }); return loginRun; }
async function afterLoginInner() {
  if (recovering) return recoveryView();
  if (appStarted) { show(false); return; }
  box.innerHTML = `<p class="lead">자료를 불러오는 중...</p>`; show(true);
  let p;
  try { p = await loadProfile(); } catch (e) { box.innerHTML = `<p class="msg err">${esc(e.message)}</p>`; return; }
  window.ME = p;
  if (!p || !p.approved) return pendingView(p);
  if (!appStarted) {
    let brand = sessionStorage.getItem('gfa-brand');
    if (!brand) brand = await brandPick();
    window.__GFA_BRAND__ = brand;
    box.classList.remove('wide'); box.innerHTML = `<p class="lead">${brand === 'drby' ? '닥터바이' : '바이랩'} 자료를 불러오는 중...</p>`;
    try { window.__GFA_DATA__ = await loadData(brand); } catch (e) { box.innerHTML = `<p class="msg err">자료를 못 불러왔습니다: ${esc(e.message)}</p>`; return; }
    installExtras(p);
    const s = document.createElement('script'); s.textContent = document.getElementById('appsrc').textContent; document.body.appendChild(s);
    appStarted = true;
  }
  show(false);
}

// ---------- header user box, account modal, admin page ----------
function installExtras(p) {
  if (document.querySelector('.userbox')) return;
  const top = document.querySelector('.topin');
  const ub = document.createElement('div'); ub.className = 'userbox';
  ub.innerHTML = `<span>${esc(p.name || p.email)}${p.is_admin ? ' · 관리자' : ''}</span><button id="acct">내 계정</button><button id="logout">로그아웃</button>`;
  top.appendChild(ub);
  ub.querySelector('#logout').onclick = async () => { try { sessionStorage.removeItem('gfa-brand'); } catch {} await sb.auth.signOut(); location.hash = ''; location.reload(); };
  ub.querySelector('#acct').onclick = accountModal;
  if (p.is_admin && !document.querySelector('#tabs a[href="#admin"]')) {
    const a = document.createElement('a'); a.href = '#admin'; a.textContent = '회원 관리'; document.getElementById('tabs').appendChild(a);
  }
  window.EXTRA_PAGES = { admin: p.is_admin ? adminPage : null, account: () => { location.hash = '#home'; setTimeout(accountModal, 50); } };
}
function accountModal() {
  const p = window.ME;
  openModal(`<h2>내 계정</h2><p class="sub">${esc(p.name)} · ${esc(p.email)}${p.is_admin ? ' · 관리자' : ''}</p>
  <h2 style="margin-top:18px;font-size:16px">비밀번호 바꾸기</h2>
  <form id="cpf" style="max-width:360px">
    <p><label>지금 비밀번호<br><input type="password" id="cp0" required autocomplete="current-password" style="width:100%"></label></p>
    <p><label>새 비밀번호 (8자 이상)<br><input type="password" id="cp1" required minlength="8" autocomplete="new-password" style="width:100%"></label></p>
    <p><label>새 비밀번호 확인<br><input type="password" id="cp2" required minlength="8" autocomplete="new-password" style="width:100%"></label></p>
    <button class="pri" id="cpb">비밀번호 바꾸기</button><p id="cpm" style="font-size:13px"></p></form>`);
  const f = document.getElementById('cpf'), m = document.getElementById('cpm');
  const say = (t, ok) => { m.textContent = t; m.style.color = ok ? '#15803d' : '#b91c1c'; };
  f.onsubmit = async e => {
    e.preventDefault();
    const [a, b, c] = ['cp0', 'cp1', 'cp2'].map(id => document.getElementById(id).value);
    if (b !== c) return say('새 비밀번호 확인이 맞지 않습니다.');
    if (b.length < 8) return say('새 비밀번호는 8자 이상이어야 합니다.');
    if (a === b) return say('지금 비밀번호와 다른 비밀번호로 정해 주세요.');
    document.getElementById('cpb').disabled = true; say('확인하는 중...', true);
    const chk = await sb.auth.signInWithPassword({ email: p.email, password: a });
    if (chk.error) { document.getElementById('cpb').disabled = false; return say('지금 비밀번호가 맞지 않습니다.'); }
    const { error } = await sb.auth.updateUser({ password: b });
    document.getElementById('cpb').disabled = false;
    if (error) return say(KO_ERR(error.message));
    f.reset(); say('비밀번호를 바꿨습니다. 다음 로그인부터 새 비밀번호를 쓰세요.', true);
  };
}
async function adminPage() {
  const app = document.getElementById('app');
  app.innerHTML = `<h1>회원 관리</h1><p class="sub" style="margin-bottom:12px">가입한 사람을 승인해야 자료를 볼 수 있습니다. 승인을 취소하면 바로 못 봅니다. 승인은 관리자(나)만 할 수 있습니다.</p><div id="mlist"><p class="muted">불러오는 중...</p></div>`;
  const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
  if (error) { document.getElementById('mlist').innerHTML = `<p style="color:#b91c1c">${esc(error.message)}</p>`; return; }
  const pend = data.filter(u => !u.approved).length;
  document.getElementById('mlist').innerHTML = `<p class="muted" style="margin-bottom:8px">전체 ${data.length}명 · 승인 대기 ${pend}명</p>
  <div class="tbl"><table><thead><tr><th>이름</th><th>이메일</th><th>가입일</th><th>상태</th><th>관리</th></tr></thead><tbody>
  ${data.map(u => `<tr><td>${esc(u.name) || '-'}</td><td>${esc(u.email)}</td><td>${new Date(u.created_at).toLocaleString('ko-KR')}</td>
    <td>${u.approved ? '<span class="tag on">승인됨</span>' : '<span class="tag off">승인 대기</span>'}${u.is_admin ? ' <span class="tag p">관리자</span>' : ''}</td>
    <td>${u.id === window.ME.id ? '<span class="muted">나</span>' : `<div class="row">
      ${u.approved ? `<button data-a="unapprove" data-id="${u.id}">승인 취소</button>` : `<button class="pri" data-a="approve" data-id="${u.id}">승인</button>`}
      <button data-a="delete" data-id="${u.id}" style="color:#b91c1c">삭제</button></div>`}</td></tr>`).join('')}
  </tbody></table></div>`;
  document.querySelectorAll('#mlist [data-a]').forEach(b => b.onclick = async () => {
    const id = b.dataset.id, a = b.dataset.a;
    const patch = { approve: { approved: true, approved_at: new Date().toISOString() }, unapprove: { approved: false } }[a];
    let res;
    if (a === 'delete') { if (!confirm('이 회원을 목록에서 지울까요? 다시 보려면 새로 가입하고 승인받아야 합니다.')) return; res = await sb.from('profiles').delete().eq('id', id); }
    else res = await sb.from('profiles').update(patch).eq('id', id);
    if (res.error) alert(res.error.message);
    adminPage();
  });
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') { recovering = true; me = session?.user; return recoveryView(); }
  if (event === 'SIGNED_OUT') { me = null; if (appStarted) location.reload(); else loginView(); return; }
  if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session) {
    const first = !me; me = session.user;
    if (first || !appStarted) setTimeout(afterLogin, 0);
    return;
  }
  if (event === 'INITIAL_SESSION' && !session) loginView();
});
})();
</script>
